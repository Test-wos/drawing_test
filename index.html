<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Drawing Editor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Drawing Editor</h1>
    <button id="create-object">2×2オブジェクト生成</button>
    <button id="create-ring">一斉生成</button>
    <button id="team-settings">チーム設定</button>
    <button id="clear-objects">全消去</button>
<div id="team-popup" style="
    display:none;
    background:white;
    border:1px solid #777;
    border-radius:10px;
    padding:20px;
    margin:15px;
    width:240px;
">
    <h3>チーム設定</h3>

    <button id="select-team-1">チームA（青）</button>
    <br><br>
    <button id="select-team-2">チームB（緑）</button>
    <br><br>
    <button id="add-team">チーム追加</button>
    <br><br>
    <button id="team-close">閉じる</button>
</div>
    <svg id="drawing-area"
        viewBox="0 0 1000 1000">
    </svg>
    
    <br><br>
        

    <button id="generate-image">全体画像を生成</button>

    <div>
        <img id="image-preview" alt="全体画像">
    </div>

<br><br>
    
<button id="export-coordinates">座標一覧</button>

<div id="coordinate-output" style="display:none;">
    <textarea id="coordinate-text" rows="12" readonly></textarea>
    <button id="copy-coordinates">コピー</button>
    <button id="close-coordinates">閉じる</button>
</div>


    <div id="edit-popup" style="
    display:none;
    background:white;
    border:1px solid #777;
    border-radius:10px;
    padding:20px;
    margin:15px;
    width:240px;
">
    <h3>オブジェクト編集</h3>

    <label>名前</label>
    <input id="edit-name" type="text" style="width:100%; font-size:16px;">

    <br><br>

    <label>チーム</label>
<select id="edit-team" style="font-size:16px;">
    <option value="1">チームA（青）</option>
    <option value="2">チームB（緑）</option>
</select>

    <br><br>

    <button id="edit-close">閉じる</button>
</div>
<script src="script.js"></script>
</body>
</html>
