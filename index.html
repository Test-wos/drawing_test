<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Drawing Editor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Drawing Editor: Planning the positions around the Sunfire Castle</h1>
    <button id="create-object">2×2オブジェクト生成</button>
    <button id="create-ring">一斉生成</button>
    <select id="team-settings" style="font-size:16px;">
    <option value="1">チームA（青）</option>
    <option value="2">チームB（緑）</option>
</select>
    <button id="clear-objects">全消去</button>

    <svg id="drawing-area"
        viewBox="0 0 1000 1000">
    </svg>
    
    <br><br>
        
    <div id="display-panels">

    <!-- オブジェクト編集欄 -->
    <section class="panel">
        <h3>オブジェクト編集</h3>

        <div id="edit-popup">
            <p>編集するオブジェクトを選択してください。</p>

            <label>名前</label>
            <input id="edit-name" type="text">

            <br><br>

            <label>チーム</label>
            <select id="edit-team">
                <option value="1">チームA（青）</option>
                <option value="2">チームB（緑）</option>
            </select>

            <br><br>

            <button id="edit-delete" style="color:red;">
                オブジェクト削除
            </button>

            <br><br>

            <button id="edit-close">閉じる</button>
        </div>
    </section>

    <!-- 画像生成欄 -->
    <section class="panel">
        <h3>画像生成</h3>

        <button id="generate-image">全体画像を生成</button>

        <div class="panel-content">
            <img id="image-preview">
        </div>
    </section>

    <!-- 座標一覧欄 -->
    <section class="panel">
        <h3>座標一覧</h3>

        <button id="export-coordinates">座標一覧を生成</button>

        <div id="coordinate-output">
            <textarea id="coordinate-text" rows="12" readonly></textarea>

            <button id="copy-coordinates">コピー</button>
            <button id="close-coordinates">閉じる</button>
        </div>
    </section>

</div>
<script src="script.js"></script>
</body>
</html>
