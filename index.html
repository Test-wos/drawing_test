<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Drawing Editor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Drawing Editor</h1>
    <button id="create-object">2×2オブジェクト生成</button>
    <button id="create-ring">一斉生成</button>
    <svg id="drawing-area"
        viewBox="0 0 1000 1000">
    </svg>
    <button id="generate-image">全体画像を生成</button>

    <div>
        <img id="image-preview" alt="全体画像">
    </div>

    <div id="edit-popup" style="
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    border:1px solid #777;
    border-radius:10px;
    padding:20px;
    z-index:1000;
    width:240px;
    box-shadow:0 2px 10px #888;
">
    <h3>オブジェクト編集</h3>

    <label>名前</label>
    <input id="edit-name" type="text" style="width:100% font-size:16px;">

    <br><br>

    <label>色</label>
    <input id="edit-color" type="color">

    <br><br>

    <button id="edit-close">閉じる</button>
</div>
<script src="script.js"></script>
</body>
</html>
