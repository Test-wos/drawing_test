<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Drawing Editor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Drawing Editor</h1>
    <button id="create-object">2×2オブジェクト生成</button>
    <button id="create-ring">一斉生成</button>
    <svg id="drawing-area"
        viewBox="0 0 1000 1000">
    </svg>
    <button id="generate-image">全体画像を生成</button>

    <div>
        <img id="image-preview" alt="全体画像">
    </div>
    <script src="script.js"></script>
    <div id="edit-popup" style="
    display:none;
    position:fixed;
    top:20px;
    left:20px;
    background:white;
    border:1px solid black;
    padding:12px;
    z-index:1000;
">
    <span id="edit-popup-text"></span>
    <button onclick="document.getElementById('edit-popup').style.display='none'">
        閉じる
    </button>
</div>
</body>
</html>
